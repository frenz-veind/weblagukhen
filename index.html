<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>you broke me first</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @font-face {
    font-family: 'system';
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #0a0612;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #1a0e2e 0%, #0a0612 60%, #050308 100%);
    overflow: hidden;
  }

  /* Ambient floating particles */
  .particle {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,107,157,0.5), transparent);
    filter: blur(2px);
    pointer-events: none;
    animation: float linear infinite;
  }

  @keyframes float {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.4; }
    100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
  }

  /* ===== START SCREEN ===== */
  #startScreen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: opacity 0.9s ease, transform 0.9s ease;
  }

  #startScreen.hidden {
    opacity: 0;
    transform: scale(1.15);
    pointer-events: none;
  }

  .song-title {
    color: #fff;
    font-size: 2.1rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 6px;
    text-align: center;
    text-shadow: 0 0 30px rgba(255, 107, 157, 0.6);
    opacity: 0;
    animation: titleIn 1s ease forwards 0.2s;
  }

  .song-artist {
    color: rgba(255,255,255,0.5);
    font-size: 0.95rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 56px;
    opacity: 0;
    animation: titleIn 1s ease forwards 0.4s;
  }

  @keyframes titleIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #startBtn {
    position: relative;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(145deg, #ff6b9d, #c33764);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 0 0 0 rgba(255,107,157,0.5),
      0 8px 32px rgba(195, 55, 100, 0.45),
      inset 0 2px 12px rgba(255,255,255,0.25);
    animation: pulseRing 2.4s ease-out infinite, titleIn 1s ease forwards 0.6s;
    opacity: 0;
    transition: transform 0.15s ease;
  }

  #startBtn:active {
    transform: scale(0.92);
  }

  @keyframes pulseRing {
    0% { box-shadow: 0 0 0 0 rgba(255,107,157,0.55), 0 8px 32px rgba(195,55,100,0.45), inset 0 2px 12px rgba(255,255,255,0.25); }
    70% { box-shadow: 0 0 0 22px rgba(255,107,157,0), 0 8px 32px rgba(195,55,100,0.45), inset 0 2px 12px rgba(255,255,255,0.25); }
    100% { box-shadow: 0 0 0 0 rgba(255,107,157,0), 0 8px 32px rgba(195,55,100,0.45), inset 0 2px 12px rgba(255,255,255,0.25); }
  }

  #startBtn svg {
    width: 34px;
    height: 34px;
    fill: #fff;
    margin-left: 4px;
  }

  .hint {
    margin-top: 28px;
    color: rgba(255,255,255,0.3);
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    opacity: 0;
    animation: titleIn 1s ease forwards 0.9s;
  }

  /* ===== PLAYER SCREEN ===== */
  #playerScreen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.9s ease 0.3s;
    pointer-events: none;
  }

  #playerScreen.active {
    opacity: 1;
    pointer-events: auto;
  }

  .now-playing-label {
    color: rgba(255,255,255,0.35);
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .player-title {
    color: #fff;
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 50px;
    text-align: center;
    text-shadow: 0 0 24px rgba(255,107,157,0.4);
  }

  /* VISUALIZER */
  #visualizer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    height: 220px;
    width: min(90vw, 600px);
  }

  .bar {
    width: 6px;
    min-height: 6px;
    border-radius: 6px;
    background: linear-gradient(to top, #c33764 0%, #ff6b9d 45%, #ffb3c6 75%, #fff0f5 100%);
    box-shadow: 0 0 14px rgba(255, 107, 157, 0.55);
    transform-origin: center;
    transition: height 0.09s ease;
  }

  /* Controls */
  #controls {
    margin-top: 46px;
    display: flex;
    align-items: center;
    gap: 26px;
  }

  .ctrl-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50%;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
  }

  .ctrl-btn:hover { background: rgba(255,255,255,0.12); }
  .ctrl-btn:active { transform: scale(0.9); }

  .ctrl-btn svg { width: 20px; height: 20px; fill: #fff; }

  #playPauseBtn {
    width: 64px;
    height: 64px;
    background: linear-gradient(145deg, #ff6b9d, #c33764);
    box-shadow: 0 6px 24px rgba(195,55,100,0.5);
  }

  #playPauseBtn svg { width: 26px; height: 26px; }

  /* Progress bar */
  #progressWrap {
    width: min(90vw, 600px);
    margin-top: 38px;
  }

  #progressBar {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.12);
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
  }

  #progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #c33764, #ff6b9d);
    border-radius: 4px;
    transition: width 0.1s linear;
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    color: rgba(255,255,255,0.4);
    font-size: 0.75rem;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 480px) {
    .song-title, .player-title { font-size: 1.5rem; }
    #visualizer { height: 160px; }
    #startBtn { width: 84px; height: 84px; }
  }
</style>
</head>
<body>

<div id="stage">

  <div id="startScreen">
    <div class="song-title">you broke me first</div>
    <div class="song-artist">Tate McRae</div>
    <button id="startBtn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="hint">Tap to play</div>
  </div>

  <div id="playerScreen">
    <div class="now-playing-label">Now Playing</div>
    <div class="player-title">you broke me first</div>

    <div id="visualizer"></div>

    <div id="progressWrap">
      <div id="progressBar">
        <div id="progressFill"></div>
      </div>
      <div class="time-row">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div id="controls">
      <div class="ctrl-btn" id="restartBtn">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
      </div>
      <div class="ctrl-btn" id="playPauseBtn">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="ctrl-btn" id="muteBtn">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </div>
    </div>
  </div>

</div>

<audio id="audio" src="song.mp3" preload="auto"></audio>

<script>
const audio = document.getElementById('audio');
const startScreen = document.getElementById('startScreen');
const playerScreen = document.getElementById('playerScreen');
const startBtn = document.getElementById('startBtn');
const playPauseBtn = document.getElementById('playPauseBtn');
const playIcon = document.getElementById('playIcon');
const restartBtn = document.getElementById('restartBtn');
const muteBtn = document.getElementById('muteBtn');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const currentTimeEl = document.getElementById('currentTime');
const durationEl = document.getElementById('duration');
const visualizer = document.getElementById('visualizer');

// ---- Build bars ----
const BAR_COUNT = 64;
const bars = [];
for (let i = 0; i < BAR_COUNT; i++) {
  const bar = document.createElement('div');
  bar.className = 'bar';
  visualizer.appendChild(bar);
  bars.push(bar);
}

// ---- Ambient particles ----
const stage = document.getElementById('stage');
for (let i = 0; i < 22; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  const size = 2 + Math.random() * 5;
  p.style.width = size + 'px';
  p.style.height = size + 'px';
  p.style.left = Math.random() * 100 + '%';
  p.style.bottom = '-20px';
  p.style.animationDuration = (8 + Math.random() * 10) + 's';
  p.style.animationDelay = (Math.random() * 10) + 's';
  stage.appendChild(p);
}

// ---- Web Audio API setup for real frequency analysis ----
let audioCtx, analyser, source, dataArray, bufferLength;
let isSetup = false;

function setupAudioContext() {
  if (isSetup) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  bufferLength = analyser.frequencyBinCount;
  dataArray = new Uint8Array(bufferLength);

  source = audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  isSetup = true;
}

let animationId;
let usingFallback = false;

function renderBarsFromFrequency() {
  analyser.getByteFrequencyData(dataArray);
  for (let i = 0; i < BAR_COUNT; i++) {
    // Map bar index to frequency bin (skew toward lower-mid frequencies for visual richness)
    const dataIndex = Math.floor(Math.pow(i / BAR_COUNT, 1.4) * bufferLength * 0.85);
    const value = dataArray[dataIndex] || 0;
    const pct = value / 255;
    const height = 6 + pct * 200;
    bars[i].style.height = height + 'px';
  }
  animationId = requestAnimationFrame(renderBarsFromFrequency);
}

function renderBarsFallback() {
  // Fallback animated pattern if AudioContext fails (e.g. autoplay restrictions)
  const t = Date.now() / 1000;
  for (let i = 0; i < BAR_COUNT; i++) {
    const wave = Math.sin(t * 3 + i * 0.3) * 0.5 + 0.5;
    const wave2 = Math.sin(t * 5.5 + i * 0.15) * 0.5 + 0.5;
    const combined = (wave * 0.6 + wave2 * 0.4);
    const height = 6 + combined * 160;
    bars[i].style.height = height + 'px';
  }
  animationId = requestAnimationFrame(renderBarsFallback);
}

function startVisualizer() {
  try {
    setupAudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    renderBarsFromFrequency();
  } catch (e) {
    usingFallback = true;
    renderBarsFallback();
  }
}

function stopVisualizer() {
  if (animationId) cancelAnimationFrame(animationId);
  bars.forEach(b => b.style.height = '6px');
}

function decayVisualizer() {
  if (animationId) cancelAnimationFrame(animationId);
  // smooth decay to baseline when paused
  let frame = 0;
  function step() {
    frame++;
    let allLow = true;
    bars.forEach(b => {
      const curr = parseFloat(b.style.height) || 6;
      const next = Math.max(6, curr * 0.85);
      b.style.height = next + 'px';
      if (next > 7) allLow = false;
    });
    if (!allLow && frame < 60) requestAnimationFrame(step);
  }
  step();
}

// ---- Play / Pause ----
function playAudio() {
  audio.play();
  startVisualizer();
  playIcon.outerHTML = '<svg id="playIcon" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
}

function pauseAudio() {
  audio.pause();
  decayVisualizer();
  document.getElementById('playIcon').outerHTML = '<svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
}

startBtn.addEventListener('click', () => {
  startScreen.classList.add('hidden');
  playerScreen.classList.add('active');
  playAudio();
});

playPauseBtn.addEventListener('click', () => {
  if (audio.paused) {
    playAudio();
  } else {
    pauseAudio();
  }
});

restartBtn.addEventListener('click', () => {
  audio.currentTime = 0;
  if (audio.paused) playAudio();
});

let isMuted = false;
muteBtn.addEventListener('click', () => {
  isMuted = !isMuted;
  audio.muted = isMuted;
  muteBtn.style.opacity = isMuted ? '0.4' : '1';
});

// ---- Progress bar ----
function formatTime(sec) {
  if (!isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

audio.addEventListener('loadedmetadata', () => {
  durationEl.textContent = formatTime(audio.duration);
});

audio.addEventListener('timeupdate', () => {
  const pct = (audio.currentTime / audio.duration) * 100 || 0;
  progressFill.style.width = pct + '%';
  currentTimeEl.textContent = formatTime(audio.currentTime);
});

audio.addEventListener('ended', () => {
  document.getElementById('playIcon').outerHTML = '<svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  decayVisualizer();
});

progressBar.addEventListener('click', (e) => {
  const rect = progressBar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});
</script>

</body>
</html>
